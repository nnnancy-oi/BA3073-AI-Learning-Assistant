server {
 listen 80 default_server;
 server_name _;
 return 404;
}
server {
 listen 80;
 server_name nick-ba3073-2026.duckdns.org access.nick-ba3073-2026.duckdns.org;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl http2;
 server_name nick-ba3073-2026.duckdns.org;
 ssl_certificate /etc/letsencrypt/live/nick-ba3073-2026.duckdns.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/nick-ba3073-2026.duckdns.org/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:AILATLS:10m;
ssl_session_timeout 1d;
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options nosniff always;

 client_max_body_size 201m;
 location = /__proxy_auth {
   internal;
   proxy_pass http://127.0.0.1:8082/auth;
   proxy_pass_request_body off;
   proxy_set_header Content-Length "";
   proxy_set_header X-Host $host;
   proxy_set_header X-Origin-URI $request_uri;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Authorization "";
 }
 location ^~ /api/ { include /etc/nginx/snippets/aila-backend.conf; }
 location / {
   include /etc/nginx/snippets/aila-backend.conf;
   error_page 401 = @login;
 }
 location @login { return 302 https://access.nick-ba3073-2026.duckdns.org/login; }
}
server {
 listen 443 ssl http2;
 server_name access.nick-ba3073-2026.duckdns.org;
 ssl_certificate /etc/letsencrypt/live/nick-ba3073-2026.duckdns.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/nick-ba3073-2026.duckdns.org/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:AILATLS:10m;
ssl_session_timeout 1d;
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options nosniff always;

 client_max_body_size 16k;
 location = / { return 302 /login; }
 location ~ ^/(login|logout)$ {
   limit_req zone=aila_login burst=10 nodelay;
   limit_req_status 429;
   proxy_pass http://127.0.0.1:8082;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Authorization "";
   proxy_redirect ~^/login(?:\?.*)?$ https://access.nick-ba3073-2026.duckdns.org/login;
   proxy_redirect ~^.+$ https://nick-ba3073-2026.duckdns.org/ui/;
   proxy_read_timeout 15s;
 }
 location / { return 404; }
}
